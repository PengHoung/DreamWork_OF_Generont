pages:
  stage: deploy
  script:
    - npm install
    - npx tailwindcss -i ./src/css/index.css -o ./dist/output.css --minify
    - mkdir public
    # This line moves your files so index.html is at the root
    - cp src/index.html public/
    - cp -r dist img public/
  artifacts:
    paths:
      - public
  only:
    - develop