name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "develop", "master"] 
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci
      - name: Build CSS
        run: |
          mkdir -p dist
          npx tailwindcss -i ./src/css/index.css -o ./dist/output.css --minify
      - name: Debug File System
        run: ls -R
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare Public Directory
        run: |
          mkdir -p public
          # Copy folders individually
          cp -r src public/ || echo "src copy failed"
          cp -r img public/ || echo "img copy failed"
          cp -r dist public/ || echo "dist copy failed"
          
          # Create .nojekyll
          touch public/.nojekyll
          
          # Create redirect
          echo '<!DOCTYPE html><html><head><script>window.location.href = "src/index.html";</script><meta http-equiv="refresh" content="0;url=src/index.html"></head><body>Redirecting...</body></html>' > public/index.html
          
          # Debug Public Directory
          ls -R public

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
